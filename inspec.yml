name: aws-rds-crunchy-data-postgresql-stig-baseline
title: aws-rds-crunchy-data-postgresql-16-stig-baseline
maintainer: Thomas Lord
copyright: Booz Allen Hamilton, 2026
summary: "InSpec Validation Profile for AWS RDS hosted Crunchy Data Postgres 16 Security Technical Implementation Guide (STIG)"
license: Apache-2.0
description: >
  A standalone InSpec Compliance Profile that validates the secure configuration of
  AWS RDS-hosted PostgreSQL 16 (and later) against the DISA "Crunchy Data Postgres 16"
  STIG, Version 1 Release 3 (V1R3), released 01 Jul 2026. Control titles, check text,
  and fix text are sourced directly from the published benchmark
  (https://public.cyber.mil/stigs/, STIG ID: CD_Postgres_16_STIG). This profile does
  not depend on any third-party InSpec baseline; all controls are implemented directly
  against this benchmark.
version: 1.0.0
inspec_version: ">= 4.0"

inputs:
# =====================================================================
# REQUIRED: database info. This is the only section a user normally
# needs to fill in. Everything below it already has a STIG-aligned
# default and only needs overriding if your organization's documented
# policy differs from that default.
#
# Recommended path: set aws_db_instance_identifier (+ aws_region) and
# pg_dba_password; pg_host/pg_port/pg_db/pg_dba are then auto-discovered
# via `aws rds describe-db-instances`. pg_dba_password can never be
# auto-discovered (it's a secret) and must always be supplied manually.
# =====================================================================
- name: aws_db_instance_identifier
  description: "The RDS DB instance identifier (not the endpoint hostname). When set (and the AWS CLI is available), pg_host/pg_port/pg_db/pg_dba below are auto-discovered via `aws rds describe-db-instances` and the manual values are only used as a fallback."
  type: string
  value: ""

- name: aws_region
  description: "AWS region of the RDS instance, passed to the AWS CLI via --region"
  type: string
  value: ""

- name: pg_dba_password
  description: "The password for the postgres DBA user. Always required manually \u2014 the AWS CLI/API has no way to retrieve this secret."
  type: string
  value: ""
  required: true
  sensitive: true

# --- Manual connection fallback (only used if aws_db_instance_identifier is unset,
#     or the AWS CLI is unavailable) ---
- name: pg_dba
  description: "Fallback postgres DBA (master) user; overridden by the auto-discovered MasterUsername when AWS CLI discovery succeeds."
  type: string
  value: "postgres"
  required: true
  sensitive: true

- name: pg_host
  description: "Fallback hostname/endpoint; overridden by the auto-discovered Endpoint.Address when AWS CLI discovery succeeds, unless pg_use_manual_endpoint is set."
  type: string
  value: "localhost"
  required: true
  sensitive: true

- name: pg_port
  description: "Fallback port; overridden by the auto-discovered Endpoint.Port when AWS CLI discovery succeeds, unless pg_use_manual_endpoint is set."
  type: numeric
  value: 5432

- name: pg_use_manual_endpoint
  description: "Connect SQL to pg_host/pg_port even when AWS CLI discovery is in use, e.g. through a bastion host or SSH tunnel. pg_db, pg_dba and all AWS checks still use discovery"
  type: boolean
  value: false
  required: true

- name: pg_db
  description: "Fallback database name; overridden by the auto-discovered DBName when AWS CLI discovery succeeds."
  type: string
  value: "postgres"
  required: true

- name: aws_cli_profile
  description: "Optional named AWS CLI profile to use (--profile); leave blank to use the runner's default credential chain"
  type: string
  value: ""

# =====================================================================
# OPTIONAL: organization policy overrides. Each of these already has a
# STIG-aligned default below; only set one here if your documented
# System Security Plan specifies a different value.
# =====================================================================
- name: pg_superusers
  description: "Authorized superuser accounts (e.g., AWS RDS 'rdsadmin')"
  type: array
  value:
    - "rdsadmin"

- name: pg_rds_superusers
  description: "Roles authorized to hold rds_superuser, directly or through another role, besides the instance's master user (from AWS MasterUsername), which is always allowed (V-261924). Checked only with AWS discovery"
  type: array
  value: []
  sensitive: true

- name: pg_max_connections
  description: "Organization-defined maximum number of concurrent connections (V-261857)"
  type: numeric
  value: 100

- name: pg_log_line_prefix
  description: "Organization-defined log_line_prefix capturing timestamp, user, database, and client (V-261866/867/868/871/922)"
  type: string
  value: "%m [%p]: db=%d,user=%u,app=%a,client=%h "

- name: pg_log_connections
  description: "Expected value of log_connections (V-261866/956/961/964)"
  type: string
  value: "on"

- name: pg_log_disconnections
  description: "Expected value of log_disconnections (V-261866/961/964)"
  type: string
  value: "on"

- name: pg_log_hostname
  description: "Expected value of log_hostname (V-261869)"
  type: string
  value: "on"

- name: pg_timezone
  description: "Organization-defined log_timezone (V-261921)"
  type: string
  value: "UTC"

- name: pg_ssl
  description: "Expected value of ssl (V-261900/928/932/933)"
  type: string
  value: "on"

- name: pg_password_encryption
  description: "Expected value of password_encryption (V-261891, V-261892)"
  type: string
  value: "scram-sha-256"

- name: pg_client_min_messages
  description: "Expected value of client_min_messages (V-261908/909)"
  type: string
  value: "error"

- name: pg_log_file_mode
  description: "Expected value of log_file_mode (V-261875/879/909)"
  type: string
  value: "0600"

- name: pgaudit_log_items
  description: "pgaudit.log classes that must be enabled (V-261938 and related audit controls). Accepts pgaudit syntax, e.g. [\"all\", \"-misc\"]"
  type: array
  value:
    - "ddl"
    - "role"
    - "read"
    - "write"

- name: pg_encryption_of_data_at_rest_required
  description: "Whether the application owner/AO has determined encryption of data at rest is required (V-261901/930/931)"
  type: boolean
  value: true

- name: pg_require_customer_managed_kms_key
  description: "Whether RDS storage must be encrypted with a customer-managed KMS key rather than an AWS-managed one such as aws/rds (V-261901/930/931). The STIG doesn't require it; set true if your policy does. Needs kms:DescribeKey"
  type: boolean
  value: false

- name: pg_storage_alarm_threshold_percent
  description: "Organization-defined percent-utilized threshold at which support staff must be warned of audit/storage capacity (V-261919)"
  type: numeric
  value: 75

- name: pg_approved_ingress_cidrs
  description: "IPv4/IPv6 CIDR blocks and prefix-list IDs approved by the organization's PPSM CAL/vulnerability assessment to reach the database port (V-261889/V-261926). Any other source is a finding; 0.0.0.0/0 and ::/0 are always a finding"
  type: array
  value: []
